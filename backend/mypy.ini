[mypy]
plugins = pydantic.mypy
python_version = 3.12
mypy_path = ., ..
explicit_package_bases = True
follow_imports = silent
strict = True
disallow_any_explicit = True
files = app/runtime/trace_bridge.py, ../extensions/evals/runtime_types.py, app/agent_base/core/message.py, app/agent_base/agents/react_runtime/react_types.py, app/services/agent_execution.py, app/agent_base/host_api, app/agent_base/adapters/host_services.py, ../shared/llm_types.py

[pydantic-mypy]
init_typed = True
init_forbid_extra = True
